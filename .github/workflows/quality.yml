name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --all-extras --dev --python "${{ matrix.python }}" --locked
      - name: Static checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src tools
      - name: Content and generated README checks
        run: |
          uv run python tools/validate_content.py
          uv run python tools/validate_labs.py
          uv run python tools/build_readme.py --check
          uv run python tools/check_resource_catalog.py --internal
      - name: Test
        run: uv run pytest --cov=agent_learning_hub --cov-report=term-missing
      - name: Critical safety branch coverage
        run: >-
          uv run pytest
          tests/unit/test_calculator.py
          tests/unit/test_registry_and_policies.py
          tests/unit/test_retrieval.py
          --cov=agent_learning_hub.tools.calculator
          --cov=agent_learning_hub.policies.permissions
          --cov=agent_learning_hub.retrieval.validation
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100

  web:
    name: Frontend, docs and browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv sync --all-extras --dev --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Frontend and Markdown tests
        run: |
          npm test
          npm run lint:md
      - name: Rebuild generated content
        run: |
          uv run python tools/build_site_content.py
          npm run build
          git diff --exit-code -- README.md site/generated
          uv run python tools/check_worktree_clean.py
      - name: Build and budget
        run: |
          uv run mkdocs build --strict
          uv run python tools/check_site_budget.py
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.19"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Audit dependencies
        run: |
          uv sync --all-extras --dev --locked
          uv run pip-audit --local
          npm ci
          npm audit --omit=dev --audit-level=high
